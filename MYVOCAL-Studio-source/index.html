<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0d18" />
  <title>MYVOCAL Studio · v1.8 Step03</title>
</head>
<body><div id="root"><div role="status" data-boot-placeholder="true" style="min-height:100vh;padding:38px;box-sizing:border-box;background:#0a0d18;color:#fff;font-family:system-ui,sans-serif"><strong>MYVOCAL Studio 시작 중</strong><p>화면을 불러오는 중입니다. 이 안내가 계속 남으면 Windows 화면 초기화를 확인해야 합니다.</p></div></div><script>
(function(){
  function show(detail){
    var root=document.getElementById('root');
    if(!root || root.querySelector('button')) return;
    var message=String(detail||'스크립트 오류').slice(0,480);
    window.__MYVOCAL_BOOT_ERROR__=message;
    root.textContent='';
    var wrapper=document.createElement('div');
    wrapper.setAttribute('role','alert');
    wrapper.style.cssText='min-height:100vh;box-sizing:border-box;background:#0a0d18;color:#fff;padding:40px;font-family:system-ui,sans-serif';
    var title=document.createElement('h1');title.textContent='MYVOCAL Studio 초기화 오류';
    var body=document.createElement('p');body.textContent='화면 코드를 시작하지 못했습니다. 기존 녹음·모델·프로젝트는 변경하지 않았습니다.';
    var error=document.createElement('pre');error.style.cssText='white-space:pre-wrap;color:#ffb8b8';
    error.textContent=message;
    wrapper.append(title,body,error);root.appendChild(wrapper);
  }
  window.addEventListener('error',function(event){show(event.message||event.error?.message);});
  window.addEventListener('unhandledrejection',function(event){show(event.reason?.message||event.reason);});
})();
</script><script type="module" src="/src/main.jsx"></script></body>
</html>
