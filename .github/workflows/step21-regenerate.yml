name: Step21 generate standalone artifacts
on:
  push:
    branches: ['myvocal/step21-genre-mix']
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: myvocal/step21-genre-mix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install standalone transpiler
        run: npm install --no-save --package-lock=false --ignore-scripts typescript@5.9.3
        working-directory: MYVOCAL-Studio-source
      - name: Rebuild original standalone bundle
        run: npm run build:standalone
        working-directory: MYVOCAL-Studio-source
      - name: Synchronize Windows embedded UI
        run: cp MYVOCAL-Studio-source/MYVOCAL-Studio-v1.8.html desktop/index.html
      - name: Commit generated files (branch only)
        shell: bash
        run: |
          set -euo pipefail
          git add MYVOCAL-Studio-source/MYVOCAL-Studio-v1.8.html desktop/index.html
          if git diff --cached --quiet; then
            echo "Generated artifacts were already up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: synchronize Step21 standalone and Windows embedded HTML'
          git push origin HEAD:myvocal/step21-genre-mix
