name: MYVOCAL Windows validation
on:
  push:
    branches: [main, 'test/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-compatibility:
    name: ${{ matrix.os }} - Go tests and Windows build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current UI for desktop EXE
        working-directory: MYVOCAL-Studio-source
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'npm test failed' }
          node scripts/build-standalone.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Standalone build failed' }
          Copy-Item -LiteralPath MYVOCAL-Studio-v1.8.html -Destination ../desktop/index.html -Force
      - name: Go desktop tests
        working-directory: desktop
        run: go test ./...
      - name: Go desktop vet
        working-directory: desktop
        run: go vet ./...
      - name: Compile Windows x64 GUI
        working-directory: desktop
        run: go build -trimpath -ldflags='-s -w -H windowsgui' -o ../MYVOCAL-Studio-Windows.exe .
      - name: Compile Windows x64 COM mock tests
        working-directory: desktop
        run: go test -c -o ../MYVOCAL-Windows-Tests.exe .
      - name: Package native Windows application with official x64 WebView2 loader
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.4258.31 -OutputDirectory "$env:RUNNER_TEMP\webview2" -NonInteractive
          $loader = Join-Path $env:RUNNER_TEMP "webview2\Microsoft.Web.WebView2.1.0.4258.31\runtimes\win-x64\native\WebView2Loader.dll"
          if (-not (Test-Path -LiteralPath $loader)) { throw "Official x64 WebView2Loader.dll not found" }
          Copy-Item -LiteralPath $loader -Destination "WebView2Loader.dll"
          Compress-Archive -LiteralPath @("MYVOCAL-Studio-Windows.exe", "WebView2Loader.dll", "desktop/NOTICE.txt", "MYVOCAL-Studio-source/third_party/react-MIT-LICENSE.txt") -DestinationPath "MYVOCAL-Studio-Windows.zip" -Force
      - name: Upload unsigned Windows application and tests
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ matrix.os }}
          path: |
            MYVOCAL-Studio-Windows.zip
            MYVOCAL-Studio-Windows.exe
            MYVOCAL-Windows-Tests.exe
          retention-days: 7
