name: MYVOCAL Windows validation
on:
  push:
    branches: [main, 'test/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-compatibility:
    name: ${{ matrix.os }} - Go tests and Windows build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current UI for desktop EXE
        working-directory: MYVOCAL-Studio-source
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'npm test failed' }
          node scripts/build-standalone.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Standalone build failed' }
          Copy-Item -LiteralPath MYVOCAL-Studio-v1.8.html -Destination ../desktop/index.html -Force
      - name: Go desktop tests
        working-directory: desktop
        run: go test ./...
      - name: Go desktop vet
        working-directory: desktop
        run: go vet ./...
      - name: Compile Windows x64 GUI
        working-directory: desktop
        run: go build -trimpath -ldflags='-s -w -H windowsgui' -o ../MYVOCAL-Studio-Windows.exe .
      - name: Compile Windows x64 COM mock tests
        working-directory: desktop
        run: go test -c -o ../MYVOCAL-Windows-Tests.exe .
      - name: Package native Windows application with official x64 WebView2 loader
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.4258.31 -OutputDirectory "$env:RUNNER_TEMP\webview2" -NonInteractive
          $loader = Join-Path $env:RUNNER_TEMP "webview2\Microsoft.Web.WebView2.1.0.4258.31\runtimes\win-x64\native\WebView2Loader.dll"
          if (-not (Test-Path -LiteralPath $loader)) { throw "Official x64 WebView2Loader.dll not found" }
          Copy-Item -LiteralPath $loader -Destination "WebView2Loader.dll"
          Compress-Archive -LiteralPath @("MYVOCAL-Studio-Windows.exe", "WebView2Loader.dll", "desktop/NOTICE.txt", "desktop/MIGRATE-TO-NATIVE.bat", "MYVOCAL-Studio-source/third_party/react-MIT-LICENSE.txt") -DestinationPath "MYVOCAL-Studio-Windows.zip" -Force
      - name: Run real Windows EXE and click GUI navigation buttons
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $evidencePath = Join-Path $env:RUNNER_TEMP 'MYVOCAL-Windows-GUI-Test'
          New-Item -ItemType Directory -Path $evidencePath -Force | Out-Null
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'MYVOCAL-Isolated-Desktop-Profile'
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          $env:MYVOCAL_DESKTOP_HOST = 'webview2'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'MYVOCAL-Studio-Windows.exe'
          $process = $null
          $window = $null
          $report = @{ runner = $env:RUNNER_OS; executable = $exe; stage = 'start'; buttonClicks = @(); passed = $false }
          try {
            if (-not (Test-Path -LiteralPath $exe)) { throw 'Windows executable missing' }
            if (-not (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'WebView2Loader.dll'))) { throw 'WebView2Loader.dll missing' }
            $process = Start-Process -FilePath $exe -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru
            $report['processId'] = $process.Id
            $root = [System.Windows.Automation.AutomationElement]::RootElement
            $processCondition = [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $process.Id)
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 2
              $process.Refresh()
              if ($process.HasExited) { throw "EXE exited during GUI startup: $($process.ExitCode)" }
              $windows = $root.FindAll([System.Windows.Automation.TreeScope]::Children, $processCondition)
              for ($w = 0; $w -lt $windows.Count; $w++) {
                if ($windows.Item($w).Current.Name -match 'MYVOCAL') { $window = $windows.Item($w); break }
              }
              if ($null -ne $window) { break }
            }
            if ($null -eq $window) { throw 'No MYVOCAL desktop window exposed to UI Automation' }
            $report['windowName'] = $window.Current.Name
            $report['stage'] = 'window-visible'
            $status = Invoke-WebRequest -Uri 'http://127.0.0.1:58319/__myvocal_status' -UseBasicParsing -TimeoutSec 10
            if ($status.StatusCode -ne 200 -or $status.Content -notmatch 'MYVOCAL-Studio-Windows') { throw 'Running EXE did not serve expected internal status' }
            $report['stage'] = 'ui-buttons'
            $buttonType = [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)
            # The translated dashboard includes descriptive text in accessible names.
            # Keep the real OS UI Automation click; never simulate a DOM event.
            $targets = @(
              @{ label = 'Music Studio'; namePattern = '(?i)(Music Studio|MUSIC STUDIO|직접 작곡하기)' },
              @{ label = 'Music Video Studio'; namePattern = '(?i)(Music Video Studio|VIDEO STUDIO|뮤직비디오 만들기)' }
            )
            foreach ($target in $targets) {
              $button = $null
              $names = @()
              for ($i = 0; $i -lt 20; $i++) {
                $buttons = $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, $buttonType)
                $names = @()
                for ($j = 0; $j -lt $buttons.Count; $j++) {
                  $candidate = $buttons.Item($j)
                  $candidateName = $candidate.Current.Name
                  if ($candidateName) { $names += $candidateName }
                  if ($candidateName -match $target.namePattern) { $button = $candidate; break }
                }
                if ($null -ne $button) { break }
                Start-Sleep -Seconds 2
              }
              if ($null -eq $button) {
                $names | Set-Content -Path (Join-Path $evidencePath 'accessibility-buttons.txt') -Encoding utf8
                $allElements = $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
                $debugNames = @()
                for ($j=0; $j -lt [Math]::Min(250,$allElements.Count); $j++) {
                  $el = $allElements.Item($j)
                  $debugNames += "$($el.Current.ControlType.ProgrammaticName): $($el.Current.Name)"
                }
                $debugNames | Set-Content -Path (Join-Path $evidencePath 'accessibility-tree.txt') -Encoding utf8
                throw "Could not find real WebView2 UI control: $($target.label); accessible button count=$($names.Count)"
              }
              $invoke = $button.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
              $invoke.Invoke()
              $report['buttonClicks'] += $target.label
              Start-Sleep -Seconds 2
            }
            $report['stage'] = 'complete'
            $report['passed'] = $true
          } catch {
            $report['error'] = $_.Exception.ToString()
            throw
          } finally {
            try {
              if ($null -ne $window) {
                $box = $window.Current.BoundingRectangle
                if ($box.Width -gt 20 -and $box.Height -gt 20 -and $box.Width -lt 4000 -and $box.Height -lt 4000) {
                  Add-Type -AssemblyName System.Drawing
                  $bitmap = [System.Drawing.Bitmap]::new([int]$box.Width, [int]$box.Height)
                  $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
                  try {
                    $graphics.CopyFromScreen([int]$box.X, [int]$box.Y, 0, 0, $bitmap.Size)
                    $bitmap.Save((Join-Path $evidencePath 'window.png'), [System.Drawing.Imaging.ImageFormat]::Png)
                  } finally { $graphics.Dispose(); $bitmap.Dispose() }
                }
              }
            } catch { $report['screenshotError'] = $_.Exception.Message }
            if ($null -ne $process) {
              try {
                $process.Refresh()
                if (-not $process.HasExited) {
                  $null = $process.CloseMainWindow()
                  Start-Sleep -Seconds 2
                  $process.Refresh()
                  if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
                }
              } catch { $report['shutdownError'] = $_.Exception.Message }
            }
            try {
              $appLog = Join-Path $env:LOCALAPPDATA 'MYVOCAL Studio\logs\launcher.log'
              if (Test-Path $appLog) { Copy-Item $appLog (Join-Path $evidencePath 'launcher.log') -Force }
            } catch {}
            $report | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $evidencePath 'result.json') -Encoding utf8
            Get-Content (Join-Path $evidencePath 'result.json')
          }
      - name: Run isolated Windows project creation and restart GUI test
        shell: pwsh
        timeout-minutes: 7
        run: ./tests/windows-project-journey.ps1
      - name: Diagnose native Windows file picker separately after GUI failure
        if: failure()
        shell: pwsh
        timeout-minutes: 2
        run: ./tests/windows-file-dialog-probe.ps1
      - name: Upload isolated Windows project journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-project-journey-${{ matrix.os }}
          path: ${{ runner.temp }}/MYVOCAL-Windows-Project-Journey/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload real Windows GUI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/MYVOCAL-Windows-GUI-Test/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload unsigned Windows application and tests
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ matrix.os }}
          path: |
            MYVOCAL-Studio-Windows.zip
            MYVOCAL-Studio-Windows.exe
            MYVOCAL-Windows-Tests.exe
          retention-days: 7
