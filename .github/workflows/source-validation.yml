name: MYVOCAL source validation
on:
  push:
    branches: [main, 'myvocal/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require complete source before accepting builds
        shell: bash
        run: |
          set -euo pipefail
          required=(
            MYVOCAL-Studio-source/package.json
            MYVOCAL-Studio-source/index.html
            MYVOCAL-Studio-source/src/App.jsx
            MYVOCAL-Studio-source/src/lib/bundleSafety.js
            MYVOCAL-Studio-source/tests/bundle-safety.test.mjs
            desktop/go.mod
            desktop/main.go
            desktop/native_webview_windows.go
            desktop/browser_profile.go
            docs/MYVOCAL-66-ORIGINAL.md
          )
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Source not imported. Do not merge this branch."
              exit 1
            fi
          done
  javascript:
    needs: inventory
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MYVOCAL-Studio-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  desktop:
    needs: inventory
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
      - run: go test ./...
      - run: go vet ./...
      - name: Windows cross compile only, not real device verification
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/MYVOCAL-Studio-Windows.exe .
