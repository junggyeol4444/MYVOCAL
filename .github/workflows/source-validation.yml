name: MYVOCAL source validation
on:
  push:
    branches: [main, 'test/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MYVOCAL-Studio-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node scripts/build-standalone.cjs
      - name: Validate workspace archive test coverage
        run: node --test tests/full-workspace-backup.test.mjs
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
      - run: go test ./...
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - name: Windows x64 cross compile
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-H=windowsgui' -o /tmp/MYVOCAL-Studio-Windows.exe .
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest -v test_cli_adapter
