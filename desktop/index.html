/* v1.4 USTX exchange steps */
.mv14-step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:center;margin:18px 0}
.mv14-step strong{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface-2,rgba(120,120,160,.18));font-size:13px}
.mv14-step span{font-size:13px;line-height:1.5}

/* v1.5 local voicebank alias metadata and pronunciation mapping */
.mv15-filepick{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 8px;font-size:13px;font-weight:650}
.mv15-filepick input{max-width:100%;font-weight:400}
.mv15-profile{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--border,#394052);border-radius:10px;padding:12px;margin:14px 0}
.mv15-profile>div{display:flex;flex-direction:column;gap:6px}
.mv15-profile span,.mv15-alias-example span{color:var(--muted,#9ba0b4);font-size:12px}
.mv15-alias-example{display:flex;flex-direction:column;gap:7px;margin:10px 0;word-break:break-all}
.mv15-alias-example code{line-height:1.8;font-size:12px;white-space:normal}
.mv15-summary{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin-top:16px;font-size:13px}
.mv15-table-wrap{overflow:auto;max-height:300px;margin-top:8px;border:1px solid var(--border,#394052);border-radius:10px}
.mv15-table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}
.mv15-table th,.mv15-table td{padding:9px 12px;border-bottom:1px solid var(--border,#394052)}
.mv15-table th{position:sticky;top:0;background:var(--surface,#1d2436)}

/* v1.6: voicebank folder inventory and install readiness panels */
.mv16-inventory{background:#111a2a;border:1px solid #344363;border-radius:9px;padding:15px 16px;margin:13px 0;color:#cad6ec;font-size:11px;line-height:1.85;overflow-wrap:anywhere}
.mv16-inventory strong{font-size:12px;display:block;color:#eceafa;margin-bottom:7px}
.mv16-inventory p{margin:3px 0 6px}.mv16-inventory code{font-size:10px;white-space:normal;color:#b7aaf7}
/* v1.8 readiness and capability audit */
.mv18-actions{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0 14px}
.mv18-mic{font-size:12px;color:var(--text-secondary,#9da7b8);margin:8px 0 14px}
.mv18-check-list,.mv18-feature-list{display:grid;gap:8px;margin:15px 0}
.mv18-check-list>div,.mv18-feature-list>div{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:11px 13px;border:1px solid rgba(160,170,200,.17);border-radius:11px}
.mv18-check-list>div>span:first-child,.mv18-feature-name{font-weight:650}
.mv18-check-list small,.mv18-feature-list p{flex:0 0 100%;margin:0;font-size:12px;color:#9ba7bc;line-height:1.5}
.mv18-summary{display:flex;flex-wrap:wrap;gap:11px;margin:12px 0;color:#c1cad9;font-size:13px}
.mv18-summary span{padding:8px 12px;border:1px solid rgba(150,160,190,.2);border-radius:9px}
.mv18-state{font-size:11px;padding:4px 9px;border-radius:999px;font-weight:700}
.mv18-basic{background:rgba(70,200,135,.13);color:#74dbaa}
.mv18-partial{background:rgba(245,188,90,.12);color:#ffcc81}
.mv18-blocked{background:rgba(245,125,140,.11);color:#ff9eb1}

/* Step 02: visible, fail-closed local data recovery instead of silent overwrite. */
.recovery-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;background:#101421;color:#f1f5fa}
.recovery-panel{max-width:640px;padding:30px;border:1px solid #536078;border-radius:16px;background:#20283a;line-height:1.65}
.recovery-panel h1{font-size:26px;margin-bottom:16px}.recovery-panel p{margin:12px 0}.recovery-detail{overflow-wrap:anywhere;color:#e2b8a7}
.recovery-actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
.recovery-panel button{border:1px solid #7184a9;padding:10px 16px;border-radius:8px;color:#fff;background:#384c70;cursor:pointer}
.recovery-error{color:#ffafaf}.storage-error-banner{position:fixed;bottom:4px;left:10%;width:80%;z-index:9999;background:#552929;color:white;padding:12px 18px;border:1px solid #ef8d8d;border-radius:12px}
